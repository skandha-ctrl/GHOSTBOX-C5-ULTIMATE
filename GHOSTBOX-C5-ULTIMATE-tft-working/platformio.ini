[platformio]
default_envs = esp32-s3-ili9488

; ==============================================================================
; COMMON ENVIRONMENT FOR ESP32-S3
; ==============================================================================
[env]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    nrf24/RF24 @ ^1.4.10
    bblanchon/ArduinoJson @ ^7.0.4
    mikalhart/TinyGPSPlus @ ^1.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    lsatan/SmartRC-CC1101-Driver-Lib @ ^2.5.7

; ==============================================================================
; ENVIRONMENT 1: ILI9488 3.5" (480x320) - Matches working_tft.ino configuration
; ==============================================================================
[env:esp32-s3-ili9488]
build_flags =
    -D ESP32_S3=1
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D USE_ILI9488=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=-1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=21
    -D TFT_RST=14
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=6000000
    -D SUPPORT_TRANSACTIONS=1
    -D LOAD_GLCD=1

; ==============================================================================
; ENVIRONMENT 2: ST7789 2.8" (240x320) - Ghostbox Display (ESP32-S3)
; ==============================================================================
[env:esp32-s3-st7789]
build_flags =
    -D ESP32_S3=1
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=21
    -D TFT_RST=14
    -D TFT_INVERSION_OFF=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    -D SUPPORT_TRANSACTIONS=1
    -D LOAD_GLCD=1

; ==============================================================================
; ESP32-C5 Environments (Legacy / Optional)
; ==============================================================================
[env:esp32-c5-ili9488]
board = esp32-c5-devkitm-1
build_flags =
    -D ESP32_C5=1
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D USE_ILI9488=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=5
    -D TFT_MOSI=4
    -D TFT_SCLK=6
    -D TFT_CS=7
    -D TFT_DC=2
    -D TFT_RST=3
    -D TFT_BL=8
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=6000000
    -D SUPPORT_TRANSACTIONS=1

